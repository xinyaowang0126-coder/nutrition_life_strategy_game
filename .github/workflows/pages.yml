name: Deploy playable Web build

on:
  push:
    branches: [main]
    paths:
      - 'Play/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
      - 'tools/verify_project.ps1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Play/
            /index.html
            /.nojekyll
            /tools/verify_project.ps1

      - name: Audit the release PCK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/verify_project.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Verification script has syntax errors.' }
          foreach ($name in @('Get-WebPackPaths', 'Assert-CleanWebPack')) {
            $definition = $ast.Find({ param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name
            }, $false)
            if ($null -eq $definition) { throw "Missing release gate: $name" }
            . ([scriptblock]::Create($definition.Extent.Text))
          }
          Assert-CleanWebPack -PackPath (Join-Path $PWD 'Play/index.pck')

      - name: Prepare the playable site and release fingerprint
        shell: python
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          import hashlib, json, os, pathlib, re, shutil
          output = pathlib.Path('_site')
          required = (
              'index.html', 'index.js', 'index.wasm', 'index.pck',
              'index.audio.worklet.js', 'index.audio.position.worklet.js',
              'index.png', 'index.icon.png', 'index.apple-touch-icon.png',
          )
          html = pathlib.Path('Play/index.html').read_text(encoding='utf-8')
          playlist = re.search(
              r'/\* LIFE_SCENES_BEGIN \*/\s*const LIFE_SCENES\s*=\s*(\[.*?\]);\s*/\* LIFE_SCENES_END \*/',
              html, re.S,
          )
          if playlist is None:
              raise SystemExit('Playable loading-page scene playlist is missing')
          scenes = json.loads(playlist.group(1))
          if not isinstance(scenes, list) or not scenes:
              raise SystemExit('Playable loading-page scene playlist is empty')
          backgrounds = []
          for scene in scenes:
              name = scene.get('web_file', '') if isinstance(scene, dict) else ''
              if not isinstance(name, str) or re.fullmatch(r'life-[a-z0-9-]+\.jpg', name) is None:
                  raise SystemExit(f'Invalid loading-page background: {name!r}')
              backgrounds.append(name)
          required += tuple(dict.fromkeys(backgrounds))
          for name in required:
              path = pathlib.Path('Play', name)
              if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or invalid Web dependency: {path}')
          shutil.copytree('Play', output / 'Play')
          for name in ('index.html', '.nojekyll'):
              shutil.copyfile(name, output / name)
          files = [
              {'path': 'Play/' + name, 'bytes': pathlib.Path('Play', name).stat().st_size,
               'sha256': hashlib.sha256(pathlib.Path('Play', name).read_bytes()).hexdigest()}
              for name in required
          ]
          manifest = {'commit': os.environ['RELEASE_COMMIT'], 'files': files}
          (output / 'release.json').write_text(json.dumps(manifest, indent=2) + '\n')
          total = sum(p.stat().st_size for p in output.rglob('*') if p.is_file())
          if total >= 1024 ** 3:
              raise SystemExit('Playable site exceeds the GitHub Pages 1 GiB limit')
          print(f'Publishing {total / 1024 ** 2:.2f} MiB from commit {manifest["commit"]}')

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
